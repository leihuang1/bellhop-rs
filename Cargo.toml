[workspace]
members = [
    "crates/bellhop",
    "crates/kraken",
    "crates/output",
    "crates/cli",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/leihuang1/pelagic"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
