[package]
name = "kraken-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kraken"
path = "src/main.rs"
# The solver library owns the kraken rustdoc output directory.
doc = false

[dependencies]
kraken = { path = "../kraken" }
bellhop-hdf5 = { path = "../bellhop-hdf5" }
clap = { version = "4.5.41", features = ["derive"] }

[dev-dependencies]
hdf5 = { package = "hdf5-metno", version = "0.14.1", features = ["static"] }
sha2 = "0.10.9"

[lints]
workspace = true
