            set -- $mapping
            json="$PWD/target/reference/json/$1.json"
            target/release/kraken export "$3" --solver "$2" > "$json"
            KRAKEN_JSON_INPUT="$json" KRAKEN_JSON_ENV="$PWD/$3" KRAKEN_JSON_REFERENCE_ROOT="$PWD/$4" \
              cargo test --release -p kraken --test differential_reference \
                json_fields_match_fresh_reference -- --ignored --exact --nocapture
            target/release/kraken run "$json" --output "${json%.json}.h5"
            KRAKEN_HDF5_RESULT="${json%.json}.h5" KRAKEN_JSON_INPUT="$json" \
            KRAKEN_JSON_ENV="$PWD/$3" KRAKEN_JSON_REFERENCE_ROOT="$PWD/$4" \
              cargo test --release -p kraken --test differential_reference \
