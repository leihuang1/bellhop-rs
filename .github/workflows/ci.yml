            'GradedElasticTopS krakenc crates/kraken/tests/fixtures/GradedElasticTopS.env target/reference/GradedElasticTopS-krakenc/GradedElasticTopS' \
            'GradedElasticPower krakenc crates/kraken/tests/fixtures/GradedElasticPower.env target/reference/GradedElasticPower-krakenc/GradedElasticPower' \
            'GradedElasticBio krakenc crates/kraken/tests/fixtures/GradedElasticBio.env target/reference/GradedElasticBio-krakenc/GradedElasticBio' \
            'TabRefBrc krakenc target/reference/TabRefCoef/run1/neggradC_brc.env target/reference/TabRefCoef/run1/neggradC_brc' \
            'TabRefIrc krakenc target/reference/TabRefCoef/run1/neggradC_irc.env target/reference/TabRefCoef/run1/neggradC_irc' \
            'BroadBandMunk kraken target/reference/cases/BroadBand/MunkK.env target/reference/BroadBand-MunkK-kraken/MunkK' \
            'BroadBandMunkComplex krakenc target/reference/cases/BroadBand/MunkK.env target/reference/BroadBand-MunkK-krakenc/MunkK' \
