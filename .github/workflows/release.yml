name: Windows release

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
  CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test on Windows
        run: cargo test --locked --release --workspace --all-features --target $env:TARGET --no-fail-fast
      - name: Build CLI
        run: cargo build --locked --release -p cli --target $env:TARGET
      - name: Check DLL dependencies
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          $imports = & dumpbin /DEPENDENTS "target\$env:TARGET\release\pelagic.exe"
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $imports
          $dlls = @($imports | Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (!$dlls.Count) { throw 'No DLL dependencies decoded' }
          $unexpected = @($dlls | Where-Object { $_ -notmatch '^(KERNEL32|ADVAPI32|BCRYPT|USERENV|WS2_32|USER32|NTDLL|SHELL32|OLE32|RPCRT4|SECUR32|CRYPT32|ucrtbase|api-ms-win-[\w-]+)\.dll$' })
          if ($unexpected.Count) { throw "Non-system DLL dependencies: $unexpected" }
      - name: Package CLI and license notices
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $metadata = & cargo metadata --locked --format-version 1 --filter-platform $env:TARGET | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          $version = ($metadata.packages | Where-Object name -eq 'cli').version
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match the Cargo version (vX.Y.Z)' }
          $name = "pelagic-v$version-windows-x64"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage, dist | Out-Null
          Copy-Item "target\$env:TARGET\release\pelagic.exe", LICENSE, NOTICE, Cargo.lock -Destination $stage
          $sources = @(
            "Pelagic v$version ($env:TARGET)",
            "Commit: $env:GITHUB_SHA",
            "Source: https://github.com/$env:GITHUB_REPOSITORY/archive/$env:GITHUB_SHA.zip",
            "Build: cargo build --locked --release -p cli --target $env:TARGET",
            'RUSTFLAGS=-C target-feature=+crt-static',
            'CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            (& rustc --version),
            '',
            'Locked build/workspace dependency sources and license notices:'
          )
          foreach ($package in $metadata.packages | Where-Object source) {
            $source = Split-Path $package.manifest_path
            $destination = Join-Path $stage "licenses\$($package.name)-$($package.version)"
            foreach ($file in Get-ChildItem -LiteralPath $source -Recurse -File | Where-Object Name -Match '^(LICENSE|LICENCE|COPYING|COPYRIGHT|NOTICE)([.-]|$)') {
              $target = Join-Path $destination ([IO.Path]::GetRelativePath($source, $file.FullName))
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
            $sources += "$($package.name) $($package.version): https://crates.io/api/v1/crates/$($package.name)/$($package.version)/download"
          }
          $sysroot = & rustc --print sysroot
          Copy-Item "$sysroot\share\doc\rust\licenses" -Destination "$stage\licenses\rust" -Recurse
          Copy-Item "$sysroot\share\doc\rust\COPYRIGHT-library.html" -Destination "$stage\licenses\rust"
          $sources | Set-Content "$stage\BUILD-INFO.txt" -Encoding utf8
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -Encoding ascii
      - name: Test the extracted ZIP
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'package smoke'
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $smoke
          $exe = Join-Path $smoke 'pelagic.exe'
          $workspace = (Get-Location).Path
          foreach ($solver in 'bellhop', 'kraken', 'krakenc') {
            $fixture = switch ($solver) {
              bellhop { 'crates/bellhop/tests/fixtures/golden/GeoHat_arrival.env' }
              kraken { 'crates/kraken/tests/fixtures/Pekeris.env' }
              krakenc { 'crates/kraken/tests/fixtures/PekerisComplexBlank.env' }
            }
            $inputFile = Join-Path $workspace $fixture
            $output = Join-Path $smoke "$solver results"
            $adapter = if ($solver -eq 'bellhop') { 'bellhop' } else { 'kraken' }
            $options = if ($adapter -eq 'kraken') { @('--solver', $solver) } else { @() }
            & $exe $adapter run $inputFile --format both --output $output @options
            if ($LASTEXITCODE -ne 0) { throw "$solver failed" }
            Set-Content "$output\notes.txt" 'unrelated'
            & $exe $adapter run $inputFile --format both --output $output @options
            if ($LASTEXITCODE -ne 0) { throw "$solver update failed" }
            if ((Get-Content "$output\notes.txt") -ne 'unrelated') { throw 'Unrelated file changed' }
            if ($adapter -eq 'bellhop') {
              $env:BELLHOP_NATIVE_INPUT = $inputFile
              $env:BELLHOP_NATIVE_OUTPUT = $output
            } else {
              Remove-Item Env:BELLHOP_NATIVE_INPUT -ErrorAction SilentlyContinue
              $env:KRAKEN_DIFFERENTIAL_ENV = $inputFile
              $env:KRAKEN_HDF5_RESULT = Join-Path $output "$([IO.Path]::GetFileNameWithoutExtension($inputFile)).h5"
            }
            $readback = & cargo test --locked --release -p cli --target $env:TARGET --test native_output actual_cli_native_layouts_match_all_hdf5_values -- --ignored --exact 2>&1
            $readback | Write-Output
            if ($LASTEXITCODE -ne 0 -or ($readback -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') { throw "$solver readback failed or ran no test" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Verify and attach to this Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check *.sha256
          gh release upload "$RELEASE_TAG" *.zip *.sha256 --clobber
