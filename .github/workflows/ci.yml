name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Documentation build
        run: cargo doc --workspace --no-deps

  differential-reference:
    runs-on: ubuntu-22.04
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pinned Fortran reference image
        run: tools/reference/build-image.sh
      - name: Prepare official differential cases
        run: |
          mkdir -p target/reference/cases
          docker run --rm --platform linux/amd64 --volume "$PWD/target/reference/cases:/out" \
            --entrypoint /bin/sh bellhop-rs-reference:v2023.5-amd64 \
            -c "cp /opt/acoustics-toolbox/tests/Munk/MunkB_Coh.env /out/ && \
                cp /opt/acoustics-toolbox/tests/SBCX/sbcx_Arr_asc.env /out/ && \
                cp /opt/acoustics-toolbox/tests/Munk/MunkK.env /opt/acoustics-toolbox/tests/Munk/MunkK.flp /out/ && \
                cp /opt/acoustics-toolbox/tests/Munk/MunkAnalytic.env /opt/acoustics-toolbox/tests/Munk/MunkS.env /out/ && \
                cp /opt/acoustics-toolbox/tests/MunkLeaky/MunkKleaky.env /opt/acoustics-toolbox/tests/MunkLeaky/MunkKleaky.flp /out/ && \
                cp /opt/acoustics-toolbox/tests/MunkLeaky/MunkKwb.env /opt/acoustics-toolbox/tests/MunkLeaky/MunkKwb.flp /out/ && \
                cp /opt/acoustics-toolbox/tests/MunkLeaky/MunkKbb.env /opt/acoustics-toolbox/tests/MunkLeaky/MunkKbb.flp /out/ && \
                cp /opt/acoustics-toolbox/tests/sduct/sductK.env /opt/acoustics-toolbox/tests/sduct/sductK.flp /out/ && \
                cp /opt/acoustics-toolbox/tests/calib/calibK.env /opt/acoustics-toolbox/tests/calib/calibK.flp /out/ && \
                mkdir -p /out/BroadBand && \
                cp /opt/acoustics-toolbox/tests/BroadBand/MunkK.env /opt/acoustics-toolbox/tests/BroadBand/MunkK.flp /out/BroadBand/ && \
                mkdir -p /out/Gulf && \
                cp /opt/acoustics-toolbox/tests/Gulf/gulf_rd.env /opt/acoustics-toolbox/tests/Gulf/gulf_ad.flp /opt/acoustics-toolbox/tests/Gulf/gulf_cm.flp /out/Gulf/"
      - name: Prepare pinned original MunkK modes and FIELD
        run: tools/reference/run-kraken-case.sh kraken target/reference/cases/MunkK.env
      - name: Fluid KRAKENC modes and FIELD numerical differential
        run: |
          for case in PekerisComplex PekerisComplexBlank PekerisComplexSlow PekerisComplexCLow PekerisComplexRefined PekerisComplexGradient PekerisComplexReverseGradient MunkLeakyPartial MunkLeakyPartialLoss MunkLeakyPartialC MunkLeakyPartialP MunkLeakyPartialS PekerisComplexSpline3 MunkAnalyticComplex TabRefBrcN TabRefBrcC TabRefIrcN TabRefIrcC; do
            tools/reference/run-kraken-case.sh krakenc "crates/kraken/tests/fixtures/$case.env"
            KRAKEN_COMPLEX_CASE="$case" \
            KRAKEN_COMPLEX_REFERENCE_ROOT="$PWD/target/reference/$case-krakenc/$case" \
            cargo test --release -p kraken --test differential_reference \
              complex_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          # Compare unmodified original .env/.flp pairs to fresh .mod/.prt/.shd.
          for case in MunkKleaky MunkKwb MunkKbb sductK calibK; do
            tools/reference/run-kraken-case.sh krakenc "target/reference/cases/$case.env"
            KRAKEN_ORIGINAL_COMPLEX_ENV="$PWD/target/reference/cases/$case.env" \
            KRAKEN_ORIGINAL_COMPLEX_ROOT="$PWD/target/reference/$case-krakenc/$case" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
      - name: Fluid modes and FIELD numerical differential
        run: |
          for case in Pekeris PekerisFiltered PekerisDense PekerisDenseLoss PekerisRefined PekerisSpline3 PekerisRigid PekerisRigidLoss PekerisHard PekerisHardBoth PekerisRigidPlane MunkLossless MunkBottomLoss MunkAnalytic SductTrapped SductPchip SductSpline; do
            tools/reference/compare-kraken.sh "crates/kraken/tests/fixtures/$case.env"
          done
          # Upstream MunkAnalytic.flp is a three-line legacy example that v2023.5 FIELD cannot parse.
          # Keep its .env byte-for-byte original; use a separately labelled coherent FIELD input.
          cp crates/kraken/tests/fixtures/MunkAnalytic.flp target/reference/cases/MunkAnalytic.flp
          tools/reference/compare-kraken.sh target/reference/cases/MunkAnalytic.env
          KRAKEN_DIFFERENTIAL_ENV="$PWD/target/reference/cases/MunkK.env" \
          KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/MunkK-kraken/MunkK" \
          cargo test --release -p kraken --test differential_reference \
            fluid_matches_fresh_reference -- --ignored --exact --nocapture
      - name: Single-profile FIELD extensions and actual CLI HDF5 differential
        run: |
          (cd crates/kraken/tests/fixtures && sha256sum -c golden/single-profile-field.sha256)
          cargo build --release -p kraken-cli
          for mapping in 'FieldScaled kraken' 'FieldPattern krakenc' 'FieldIncoherent krakenc'; do
            set -- $mapping
            case=$1
            engine=$2
            tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
          done
      - name: Multi-profile adiabatic and coupled FIELD plus actual CLI HDF5
        run: |
          (cd crates/kraken/tests/fixtures && sha256sum -c golden/multi-profile.sha256)
          for input in gulf_rd.env gulf_ad.flp gulf_cm.flp; do
            cmp "target/reference/cases/Gulf/$input" "crates/kraken/tests/fixtures/original/Gulf/$input"
          done
          mkdir -p target/reference/profile-cases
          for mapping in 'GulfAd gulf_ad' 'GulfCm gulf_cm'; do
            set -- $mapping
            cp crates/kraken/tests/fixtures/original/Gulf/gulf_rd.env "target/reference/profile-cases/$1.env"
            cp "crates/kraken/tests/fixtures/original/Gulf/$2.flp" "target/reference/profile-cases/$1.flp"
          done
          cargo build --release -p kraken-cli
          for case in ProfilesAd ProfilesCm GulfAd GulfCm; do
            case "$case" in
              Gulf*) env="$PWD/target/reference/profile-cases/$case.env" ;;
              *) env="$PWD/crates/kraken/tests/fixtures/$case.env" ;;
            esac
            reference="$PWD/target/reference/$case-kraken/$case"
            tools/reference/run-kraken-case.sh kraken "$env"
            KRAKEN_PROFILE_ENV="$env" KRAKEN_PROFILE_ROOT="$reference" \
              cargo test --release -p kraken --test differential_reference \
                profile_fields_match_fresh_reference -- --ignored --exact --nocapture
            target/release/kraken run "$env" --output "$reference.h5"
            KRAKEN_HDF5_RESULT="$reference.h5" KRAKEN_PROFILE_ENV="$env" KRAKEN_PROFILE_ROOT="$reference" \
              cargo test --release -p kraken --test differential_reference \
                profile_fields_match_fresh_reference -- --ignored --exact --nocapture
          done
      - name: Multi-frequency modes and FIELD numerical differential
        run: |
          for case in PekerisBroadband PekerisComplexBroadband MunkLeakyPchipBroadband; do
            engine=kraken
            if [ "$case" != PekerisBroadband ]; then engine=krakenc; fi
            tools/reference/run-kraken-case.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            KRAKEN_FREQUENCY_SOLVER="$engine" \
            KRAKEN_DIFFERENTIAL_ENV="$PWD/crates/kraken/tests/fixtures/$case.env" \
            KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/$case-$engine/$case" \
              cargo test --release -p kraken --test differential_reference \
                multifrequency_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          for engine in kraken krakenc; do
            tools/reference/run-kraken-case.sh "$engine" target/reference/cases/BroadBand/MunkK.env "target/reference/BroadBand-MunkK-$engine"
            KRAKEN_FREQUENCY_SOLVER="$engine" \
            KRAKEN_DIFFERENTIAL_ENV="$PWD/target/reference/cases/BroadBand/MunkK.env" \
            KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/BroadBand-MunkK-$engine/MunkK" \
              cargo test --release -p kraken --test differential_reference \
                multifrequency_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
      - name: Water material modes, FIELD and actual CLI HDF5 differential
        run: |
          cargo build --release -p kraken-cli
          for engine in kraken krakenc; do
            for case in WaterLossN WaterLossC WaterLossP WaterLossS WaterLossUnitN WaterLossUnitM WaterLossUnitF WaterLossUnitQ WaterLossUnitL WaterLossPower WaterLossThorp WaterLossFg WaterLossBio WaterLossLeaky; do
              if [ "$case" = WaterLossLeaky ] && [ "$engine" = kraken ]; then continue; fi
              tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            done
          done
      - name: Smooth boundary and TRC modes, FIELD and actual CLI HDF5 differential
        run: |
          cargo build --release -p kraken-cli
          for engine in kraken krakenc; do
            for case in FluidBoundaryVV FluidBoundaryVR FluidBoundaryVA FluidBoundaryRV FluidBoundaryRR FluidBoundaryRA FluidBoundaryAV FluidBoundaryAR FluidBoundaryAA FluidRigidPlaneLoss FluidBoundaryAir FluidTrcN FluidTrcC FluidTrcRigid; do
              if [ "$engine" = kraken ] && { [ "$case" = FluidBoundaryAir ] || [[ "$case" == FluidTrc* ]]; }; then continue; fi
              tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            done
          done
      - name: Layered fluid modes, FIELD and actual CLI HDF5 differential
        run: |
          (cd crates/kraken/tests/fixtures && sha256sum -c golden/original-double.sha256)
          mkdir -p target/reference/layered-original-inputs
          docker run --rm --platform linux/amd64 --volume "$PWD/target/reference/layered-original-inputs:/out" \
            --entrypoint /bin/sh bellhop-rs-reference:v2023.5-amd64 \
            -c 'cp /opt/acoustics-toolbox/tests/TLslices/double.env /opt/acoustics-toolbox/tests/TLslices/fieldbat.flp /out/'
          cmp target/reference/layered-original-inputs/double.env crates/kraken/tests/fixtures/OriginalLayeredDouble.env
          cmp target/reference/layered-original-inputs/fieldbat.flp crates/kraken/tests/fixtures/OriginalLayeredDouble.flp
          cargo build --release -p kraken-cli
          for engine in kraken krakenc; do
            for case in LayeredFluidN LayeredFluidC LayeredFluidP LayeredFluidS LayeredBoundaryVV LayeredBoundaryVR LayeredBoundaryRV LayeredBoundaryRR LayeredBoundaryRA LayeredBoundaryAV LayeredBoundaryAR LayeredBoundaryAA LayeredFluidThree LayeredFluidThreeWide LayeredFluidPlane LayeredFluidPower LayeredFluidBio LayeredFluidLeaky LayeredDoubleRefined OriginalLayeredDouble LayeredNormalization LayeredFluidFractional; do
              if [ "$case" = LayeredFluidLeaky ] && [ "$engine" = kraken ]; then continue; fi
              tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            done
          done
          cargo test --release -p kraken-cli --test run \
            layered_failures_preserve_output_and_remove_scratch -- --exact --nocapture
      - name: Elastic half-space modes, FIELD and actual CLI HDF5 differential
        run: |
          (cd crates/kraken/tests/fixtures && sha256sum -c golden/elastic-halfspace.sha256)
          mkdir -p target/reference/elastic-original-inputs
          docker run --rm --platform linux/amd64 --volume "$PWD/target/reference/elastic-original-inputs:/out" \
            --entrypoint /bin/sh bellhop-rs-reference:v2023.5-amd64 \
            -c 'cp /opt/acoustics-toolbox/tests/TLslices/scholte.env /opt/acoustics-toolbox/tests/TLslices/normal.env /opt/acoustics-toolbox/tests/TLslices/flused.env /opt/acoustics-toolbox/tests/TLslices/fieldbat.flp /out/'
          for mapping in 'scholte OriginalElasticScholte' 'normal OriginalElasticNormal' 'flused OriginalElasticFlused'; do
            set -- $mapping
            cmp "target/reference/elastic-original-inputs/$1.env" "crates/kraken/tests/fixtures/$2.env"
            cmp target/reference/elastic-original-inputs/fieldbat.flp "crates/kraken/tests/fixtures/$2.flp"
          done
          cargo build --release -p kraken-cli
          for engine in kraken krakenc; do
            for case in ElasticHalfBottomN ElasticHalfBottomC ElasticHalfBottomP ElasticHalfBottomS ElasticHalfTopN ElasticHalfTopC ElasticHalfTopP ElasticHalfTopS ElasticHalfBothN ElasticHalfBothC ElasticHalfBothP ElasticHalfBothS ElasticHalfLeaky ElasticHalfTopBroadband ElasticHalfPower ElasticHalfShearOnly OriginalElasticScholte OriginalElasticNormal OriginalElasticFlused; do
              if [ "$engine" = kraken ] && [ "$case" = ElasticHalfLeaky ]; then continue; fi
              tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            done
          done
          cargo test --release -p kraken-cli --test run \
            elastic_failures_preserve_output_and_remove_scratch -- --exact --nocapture
      - name: Finite elastic modes, FIELD and actual CLI HDF5 differential
        run: |
          (cd crates/kraken/tests/fixtures && sha256sum -c golden/finite-elastic.sha256 && sha256sum -c golden/graded-elastic.sha256)
          mkdir -p target/reference/finite-elastic-original-inputs
          docker run --rm --platform linux/amd64 --volume "$PWD/target/reference/finite-elastic-original-inputs:/out" \
            --entrypoint /bin/sh bellhop-rs-reference:v2023.5-amd64 \
            -c 'cp /opt/acoustics-toolbox/tests/TLslices/elsed.env /opt/acoustics-toolbox/tests/TLslices/ice.env /opt/acoustics-toolbox/tests/TLslices/fieldbat.flp /out/'
          for mapping in 'elsed OriginalElasticSediment' 'ice OriginalElasticIce'; do
            set -- $mapping
            cmp "target/reference/finite-elastic-original-inputs/$1.env" "crates/kraken/tests/fixtures/$2.env"
            cmp target/reference/finite-elastic-original-inputs/fieldbat.flp "crates/kraken/tests/fixtures/$2.flp"
          done
          cargo build --release -p kraken-cli
          for engine in kraken krakenc; do
            for case in FiniteElasticBothC FiniteElasticBothN FiniteElasticBothP FiniteElasticBothS FiniteElasticBottomC FiniteElasticBottomN FiniteElasticBottomP FiniteElasticBottomS FiniteElasticPower FiniteElasticRigid FiniteElasticShearOnly FiniteElasticStack FiniteElasticTopC FiniteElasticTopN FiniteElasticTopP FiniteElasticTopS FiniteElasticVacuum FiniteSingleIceC FiniteSingleIceP FiniteSingleIceS FiniteSingleSedimentC FiniteSingleSedimentP FiniteSingleSedimentS OriginalElasticIce OriginalElasticSediment GradedElasticTopN GradedElasticTopC GradedElasticTopP GradedElasticTopS GradedElasticBottomN GradedElasticBottomC GradedElasticBottomP GradedElasticBottomS GradedElasticStack GradedElasticPower GradedElasticBio; do
              tools/reference/compare-kraken-hdf5.sh "$engine" "crates/kraken/tests/fixtures/$case.env"
            done
          done
          tools/reference/compare-kraken-hdf5.sh kraken crates/kraken/tests/fixtures/GradedElasticTopNRefined.env
          cargo test --release -p kraken-cli --test run \
            finite_elastic_failures_preserve_output_and_remove_scratch -- --exact --nocapture
      - name: KRAKEN CLI HDF5 numerical differential
        run: |
          cargo build --release -p kraken-cli
          for case in PekerisBroadband PekerisComplexBroadband MunkLeakyPchipBroadband; do
            engine=kraken
            if [ "$case" != PekerisBroadband ]; then engine=krakenc; fi
            output="$PWD/target/reference/$case-$engine/$case.h5"
            target/release/kraken run "crates/kraken/tests/fixtures/$case.env" --solver "$engine" --output "$output"
            KRAKEN_HDF5_RESULT="$output" \
            KRAKEN_FREQUENCY_SOLVER="$engine" \
            KRAKEN_DIFFERENTIAL_ENV="$PWD/crates/kraken/tests/fixtures/$case.env" \
            KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/$case-$engine/$case" \
              cargo test --release -p kraken --test differential_reference \
                multifrequency_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          for case in MunkKleaky MunkKwb MunkKbb sductK calibK; do
            output="$PWD/target/reference/$case-krakenc/$case.h5"
            target/release/kraken run "target/reference/cases/$case.env" --solver krakenc --output "$output"
            KRAKEN_HDF5_RESULT="$output" \
            KRAKEN_ORIGINAL_COMPLEX_ENV="$PWD/target/reference/cases/$case.env" \
            KRAKEN_ORIGINAL_COMPLEX_ROOT="$PWD/target/reference/$case-krakenc/$case" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          output="$PWD/target/reference/MunkK-kraken/MunkK.h5"
          target/release/kraken run target/reference/cases/MunkK.env --output "$output"
          KRAKEN_HDF5_RESULT="$output" \
          KRAKEN_DIFFERENTIAL_ENV="$PWD/target/reference/cases/MunkK.env" \
          KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/MunkK-kraken/MunkK" \
            cargo test --release -p kraken --test differential_reference \
              fluid_matches_fresh_reference -- --ignored --exact --nocapture
          for engine in kraken krakenc; do
            output="$PWD/target/reference/BroadBand-MunkK-$engine/MunkK.h5"
            target/release/kraken run target/reference/cases/BroadBand/MunkK.env --solver "$engine" --output "$output"
            KRAKEN_FREQUENCY_SOLVER="$engine" KRAKEN_HDF5_RESULT="$output" \
            KRAKEN_DIFFERENTIAL_ENV="$PWD/target/reference/cases/BroadBand/MunkK.env" \
            KRAKEN_DIFFERENTIAL_ROOT="$PWD/target/reference/BroadBand-MunkK-$engine/MunkK" \
              cargo test --release -p kraken --test differential_reference \
                multifrequency_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
      - name: TabRefCoef generated resources, original FIELD and CLI HDF5 differential
        run: |
          tools/reference/prepare-tabref.sh
          for case in TabRefBrcN TabRefBrcC TabRefIrcN TabRefIrcC; do
            output="$PWD/target/reference/$case-krakenc/$case.h5"
            target/release/kraken run "crates/kraken/tests/fixtures/$case.env" --solver krakenc --output "$output"
            KRAKEN_HDF5_RESULT="$output" \
            KRAKEN_COMPLEX_CASE="$case" \
            KRAKEN_COMPLEX_REFERENCE_ROOT="$PWD/target/reference/$case-krakenc/$case" \
              cargo test --release -p kraken --test differential_reference \
                complex_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          for case in neggradC_geo neggradC_brc neggradC_irc; do
            env="$PWD/target/reference/TabRefCoef/run1/$case.env"
            root="$PWD/target/reference/TabRefCoef/run1/$case"
            KRAKEN_ORIGINAL_COMPLEX_ENV="$env" KRAKEN_ORIGINAL_COMPLEX_ROOT="$root" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
            target/release/kraken run "$env" --solver krakenc --output "$root.h5"
            KRAKEN_HDF5_RESULT="$root.h5" \
            KRAKEN_ORIGINAL_COMPLEX_ENV="$env" KRAKEN_ORIGINAL_COMPLEX_ROOT="$root" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
      - name: KRAKENC cubic and analytic profiles through CLI HDF5
        run: |
          for case in MunkLeakyPartialP MunkLeakyPartialS PekerisComplexSpline3 MunkAnalyticComplex; do
            output="$PWD/target/reference/$case-krakenc/$case.h5"
            target/release/kraken run "crates/kraken/tests/fixtures/$case.env" --solver krakenc --output "$output"
            KRAKEN_HDF5_RESULT="$output" \
            KRAKEN_COMPLEX_CASE="$case" \
            KRAKEN_COMPLEX_REFERENCE_ROOT="$PWD/target/reference/$case-krakenc/$case" \
              cargo test --release -p kraken --test differential_reference \
                complex_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          # These are unmodified upstream environments plus a DERIVED FIELD input.
          # MunkS was a SCOOTER fixture; neither original three-line .flp parses in FIELD.
          for case in MunkS MunkAnalytic; do
            cp crates/kraken/tests/fixtures/MunkAnalytic.flp "target/reference/cases/$case.flp"
            tools/reference/run-kraken-case.sh krakenc "target/reference/cases/$case.env"
            env="$PWD/target/reference/cases/$case.env"
            root="$PWD/target/reference/$case-krakenc/$case"
            KRAKEN_ORIGINAL_COMPLEX_ENV="$env" KRAKEN_ORIGINAL_COMPLEX_ROOT="$root" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
            target/release/kraken run "$env" --solver krakenc --output "$root.h5"
            KRAKEN_HDF5_RESULT="$root.h5" \
            KRAKEN_ORIGINAL_COMPLEX_ENV="$env" KRAKEN_ORIGINAL_COMPLEX_ROOT="$root" \
              cargo test --release -p kraken --test differential_reference \
                complex_original_fluid_matches_fresh_reference -- --ignored --exact --nocapture
          done
          KRAKEN_DIFFERENTIAL_ENV="$PWD/target/reference/cases/BroadBand/MunkK.env" \
            cargo test --release -p kraken-cli --test run \
              original_complex_spline_broadband_is_complete_and_preserves_late_failure -- --ignored --exact --nocapture
      - name: Self-contained KRAKEN JSON API and actual CLI HDF5 differential
        run: |
          cargo build --release -p kraken-cli
          mkdir -p target/reference/json
          for mapping in \
            'WaterLossPower kraken crates/kraken/tests/fixtures/WaterLossPower.env target/reference/WaterLossPower-kraken/WaterLossPower' \
            'FieldPattern krakenc crates/kraken/tests/fixtures/FieldPattern.env target/reference/FieldPattern-krakenc/FieldPattern' \
            'FluidTrcC krakenc crates/kraken/tests/fixtures/FluidTrcC.env target/reference/FluidTrcC-krakenc/FluidTrcC' \
            'LayeredFluidPower krakenc crates/kraken/tests/fixtures/LayeredFluidPower.env target/reference/LayeredFluidPower-krakenc/LayeredFluidPower' \
            'OriginalDoubleKraken kraken crates/kraken/tests/fixtures/OriginalLayeredDouble.env target/reference/OriginalLayeredDouble-kraken/OriginalLayeredDouble' \
            'OriginalDoubleKrakenc krakenc crates/kraken/tests/fixtures/OriginalLayeredDouble.env target/reference/OriginalLayeredDouble-krakenc/OriginalLayeredDouble' \
            'FiniteElasticStack krakenc crates/kraken/tests/fixtures/FiniteElasticStack.env target/reference/FiniteElasticStack-krakenc/FiniteElasticStack' \
            'FiniteElasticTopN kraken crates/kraken/tests/fixtures/FiniteElasticTopN.env target/reference/FiniteElasticTopN-kraken/FiniteElasticTopN' \
            'FiniteElasticShearOnly kraken crates/kraken/tests/fixtures/FiniteElasticShearOnly.env target/reference/FiniteElasticShearOnly-kraken/FiniteElasticShearOnly' \
            'FiniteElasticPower kraken crates/kraken/tests/fixtures/FiniteElasticPower.env target/reference/FiniteElasticPower-kraken/FiniteElasticPower' \
            'ElasticHalfTopN kraken crates/kraken/tests/fixtures/ElasticHalfTopN.env target/reference/ElasticHalfTopN-kraken/ElasticHalfTopN' \
            'ElasticHalfBothS kraken crates/kraken/tests/fixtures/ElasticHalfBothS.env target/reference/ElasticHalfBothS-kraken/ElasticHalfBothS' \
